  snippets:
    help: >-
      Du kannst diesem Befehl folgende Verben anhängen:
        - `list`, `show`: Zeigt die Liste aller Snippets an.
        - `set`, `edit`: Erstellt anhand eines Namens und eines Textes einen neuen Snippet mit diesem Namen oder ändert den Wert eines bestehenden Snippets.
        - `remove`, `rm`, `delete`: Entfernt anhand eines Namens den Snippet mit diesem Namen, falls er existiert.
        - `property`: Legt Eigenschaften von Snippets fest.

    edit:
      success: 'Snippet `%s` erfolgreich bearbeitet.'
      not-found: 'Es wurde kein Snippet mit dem Namen `%s` gefunden.'

    remove:
      success: 'Snippet `%s` wurde entfernt, falls er existierte.'

    prop:
      help: >-
        Folgende Eigenschaften sind verfügbar: `%s`.
        Um eine Eigenschaft festzulegen, hänge die Eigenschaft, den Namen des zu ändernden Snippets und den neuen Wert an;
        zum Beispiel `snippet property embed foo true`.

      success: 'Eigenschaft `%s` des Snippets `%s` ist jetzt `%s`.'

